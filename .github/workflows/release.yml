# Versions, tags and publishes @salemcobalt/tokens and @salemcobalt/ui.
#
#   push to main      -> rc prerelease  (vX.Y.Z-rc.N, npm dist-tag `next`, GitHub prerelease, no commit)
#   push to release   -> stable release (vX.Y.Z, dist-tag `latest`, GitHub release, version commit, merge back to main)
#   PR labeled canary -> canary          (0.0.0-canary.<sha7>, dist-tag `canary`, one PR comment, no tag)
#   workflow_dispatch -> dry run of the rc or stable path for the chosen branch
#
# Versions come from nx release (fixed mode; nx.json). The merged PR's label (major | minor |
# patch | skip-release) decides the bump when an rc line starts; conventional commits shape the
# changelog. npm auth is Trusted Publishing (OIDC), so there is no NPM_TOKEN. The stable path
# pushes commits past branch protection with a GitHub App token (vars.RELEASE_APP_ID +
# secrets.RELEASE_APP_PRIVATE_KEY).
# Lint, typecheck, tests and the Storybook build are not repeated here: the job waits for the
# ci workflow's `check` run on the same commit and reuses its verdict (build once).
# Setup and the release steps: docs/releasing.md.
name: release
on:
  push:
    branches: [main, release]
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Compute the version, build, test and `pnpm publish --dry-run`; push nothing'
        type: boolean
        default: true
permissions: {} # nothing by default; the job asks for what it needs
concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: false # never cancel a publish half-way
jobs:
  release:
    # A PR only gets here with the `canary` label; pushes and dispatches always do.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'canary')
    runs-on: ubuntu-latest
    timeout-minutes: 40 # includes waiting for the ci run on the same commit
    permissions:
      contents: write # tags and GitHub (pre)releases for rc and canary; stable uses the App token
      checks: read # read the ci workflow's verdict for this commit
      id-token: write # mint the OIDC token npm exchanges for a publish credential
      pull-requests: write # the canary comment
    env:
      NX_DAEMON: 'false'
      NX_TUI: 'false'
      CI_CHECK_NAME: check # the ci.yml job the main ruleset requires; rename here when it becomes ci-ok
    steps:
      - name: Decide what this run does
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          case "$EVENT" in
            pull_request) mode=canary ;;
            push|workflow_dispatch)
              case "$REF_NAME" in
                main) mode=rc ;;
                release) mode=stable ;;
                *) echo "::error::release.yml runs for main (rc) or release (stable), not $REF_NAME"; exit 1 ;;
              esac ;;
          esac
          dry=""
          [ "$EVENT" = workflow_dispatch ] && [ "$DISPATCH_DRY_RUN" = true ] && dry=1
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          echo "mode=$mode dry=${dry:-0}"

      - name: Stable releases need the release App
        if: steps.mode.outputs.mode == 'stable' && !steps.mode.outputs.dry
        env:
          HAS_APP: ${{ vars.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_APP" != true ]; then
            echo "::error::Set the RELEASE_APP_ID variable and RELEASE_APP_PRIVATE_KEY secret (docs/releasing.md, one-time setup)"
            exit 1
          fi
      - name: Mint the release App token
        if: steps.mode.outputs.mode == 'stable' && !steps.mode.outputs.dry
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # version commit, tag, merge-back; nothing else from the installation

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # nx release reads tags and the commits since them
          persist-credentials: false # push credentials are added only for the steps that push
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # version comes from packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache in a publishing job: a restored cache is an input to what
          # gets published, and the install is small (zizmor: cache-poisoning).
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Make sure npm supports Trusted Publishing (>= 11.5.1)
        run: |
          have="$(npm --version)"
          need="11.5.1"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "::error::npm $have is older than $need. Node $(node --version) from .nvmrc should bundle a newer npm; bump .nvmrc rather than installing npm ad hoc in the publish job."
            exit 1
          fi
          echo "npm $have"
      - run: pnpm install --frozen-lockfile

      - name: Wait for the ci workflow to pass on this commit
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # ci.yml runs on the same push (or on the PR head for a canary); reuse its verdict
          # instead of running lint, typecheck, tests and the Storybook build a second time.
          deadline=$((SECONDS + 25 * 60))
          while :; do
            conclusion="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100"               -q "[.check_runs[] | select(.app.slug == \"github-actions\" and .name == \"$CI_CHECK_NAME\")] | sort_by(.started_at) | last | .conclusion // \"pending\"")"
            case "$conclusion" in
              success) echo "ci passed on $SHA"; exit 0 ;;
              pending|"") ;;
              *) echo "::error::ci \`$CI_CHECK_NAME\` concluded '$conclusion' on $SHA; fix that first"; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::ci \`$CI_CHECK_NAME\` did not finish on $SHA within 25 minutes"
              exit 1
            fi
            echo "ci still running on $SHA; waiting"
            sleep 30
          done

      - name: Git identity and push credentials
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PUSH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$APP_SLUG" ]; then
            id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          # Same header actions/checkout would have persisted, but with the token this run
          # needs (the App's for stable) and removed again in the last step.
          git config "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"

      - name: Compute the next version
        id: version
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/next-version.sh

      - run: pnpm build # the only repeated step: the publish needs a fresh dist/
        if: steps.version.outputs.version != ''

      - name: Changelog, tag and GitHub prerelease (rc)
        if: steps.version.outputs.version != '' && steps.mode.outputs.mode == 'rc'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY: ${{ steps.mode.outputs.dry }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Tag the commit as it is: rc versions live in tags, never in a commit on main.
          pnpm exec nx release changelog "$VERSION" --git-commit=false --git-tag=true --git-push=true \
            ${DRY:+--dry-run}
      - name: Changelog, version commit, tag and GitHub release (stable)
        if: steps.version.outputs.version != '' && steps.mode.outputs.mode == 'stable'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FROM: ${{ steps.version.outputs.last-stable }}
          DRY: ${{ steps.mode.outputs.dry }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          # Notes cover everything since the previous stable tag, not just the last rc.
          pnpm exec nx release changelog "$VERSION" ${FROM:+--from "$FROM"} ${DRY:+--dry-run}

      # Dependency order: ui has a peer dependency on tokens. A version already on the
      # registry is skipped, so re-running after a partial failure publishes what is missing.
      - name: Publish @salemcobalt/tokens
        if: steps.version.outputs.version != ''
        run: .github/scripts/publish-if-new.sh packages/tokens
        env:
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
          DRY_RUN: ${{ steps.mode.outputs.dry }}
      - name: Publish @salemcobalt/ui
        if: steps.version.outputs.version != ''
        run: .github/scripts/publish-if-new.sh packages/ui
        env:
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
          DRY_RUN: ${{ steps.mode.outputs.dry }}

      - name: Merge release back into main
        if: steps.version.outputs.version != '' && steps.mode.outputs.mode == 'stable' && !steps.mode.outputs.dry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch origin main
          git switch -c merge-back origin/main
          if ! git merge --no-ff release -m "chore(release): merge v$VERSION back into main [skip ci]"; then
            echo "::error::release does not merge cleanly into main; merge it by hand (git merge release) and push"
            exit 1
          fi
          git push origin HEAD:main

      - name: Comment the canary install line on the PR
        if: steps.version.outputs.version != '' && steps.mode.outputs.mode == 'canary'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/canary-comment.sh

      - name: Remove push credentials
        if: always()
        run: git config --unset-all "http.https://github.com/.extraheader" || true

      - name: Summary
        if: always()
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
          DRY: ${{ steps.mode.outputs.dry }}
        run: |
          {
            echo "## release: $MODE${DRY:+ (dry run)}"
            if [ -n "$VERSION" ]; then
              echo "- version: \`$VERSION\` (npm dist-tag \`$DIST_TAG\`)"
            else
              echo "- nothing to release"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
