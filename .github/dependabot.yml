# Keeps the SHA-pinned actions in .github/workflows current (weekly) and opens one
# grouped PR a month for npm dependencies. Major bumps of react and react-dom are
# left out: a React major is a deliberate migration, not a bot PR. The cooldown
# waits a week after a release before proposing it, so a yanked or compromised
# version is usually caught upstream first (zizmor: dependabot-cooldown).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
    ignore:
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
